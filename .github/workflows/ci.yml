name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Compiler.slnx

      - name: Build
        run: dotnet build Compiler.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Run tests
        run: dotnet test Compiler.slnx --configuration ${{ matrix.configuration }} --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            **/TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload release binaries
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.os }}
          path: |
            ConsoleFrontend/bin/${{ matrix.configuration }}/net10.0/**
            CompilerBackend/bin/${{ matrix.configuration }}/net10.0/**
          if-no-files-found: error
