name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL / C#
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Restore dependencies
        run: dotnet restore Compiler.slnx

      - name: Build
        run: dotnet build Compiler.slnx --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  build-test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Compiler.slnx

      - name: Build
        run: dotnet build Compiler.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Run tests
        run: dotnet test Compiler.slnx --configuration ${{ matrix.configuration }} --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            **/TestResults/**/*.trx
          if-no-files-found: warn

      - name: Generate compiler executable (Windows)
        if: matrix.configuration == 'Release' && matrix.os == 'windows-latest'
        run: dotnet publish ./ConsoleFrontend/ConsoleFrontend.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./compiler

      - name: Generate compiler executable (Linux)
        if: matrix.configuration == 'Release' && matrix.os == 'ubuntu-latest'
        run: dotnet publish ./ConsoleFrontend/ConsoleFrontend.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./compiler

      - name: Upload release binaries
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.os }}
          path: |
            compiler
          if-no-files-found: error
